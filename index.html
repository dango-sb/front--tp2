<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"></script>
    <title>TP2 Frontend</title>
</head>
<body role="document">

<!-- Fixed navbar -->
<nav class="navbar navbar-dark bg-dark navbar-fixed-top">
    <a class="navbar-brand" href="#">TP2 Frontend</a>
</nav>

<div class="container theme-showcase" role="main" style="width: 100%">
    <div id="app">
        <br/>
        <div class="row">
            <div class="col-md-2 text-center" v-for="ingredient in ingredients" :key="ingredient.id">
                <img :src="ingredient.image" :alt="ingredient.nom" style="width: 100px; height: 100px;">
                <h5>{{ ingredient.nom }}</h5>
                <p>Quantité : {{ ingredient.quantite }}</p>
                <button class="btn btn-success"
                        @click="ajouter(ingredient)"
                        :disabled="ingredient.quantite >= 3">+</button>
                <button class="btn btn-danger"
                        @click="supprimer(ingredient)"
                        :disabled="ingredient.quantite <= 0">-</button>
            </div>
        </div>

        <br/>

        <!-- Menu -->
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="menu" v-model="menu">
            <label class="form-check-label" for="menu">Je prends un menu (+3 €)</label>
        </div>

        <div v-if="menu" class="mt-3">
            <div>
                <p><strong>Accompagnement :</strong></p>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="frites" value="Frites" v-model="accompagnement">
                    <label class="form-check-label" for="frites">Frites</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="potatoes" value="Potatoes" v-model="accompagnement">
                    <label class="form-check-label" for="potatoes">Potatoes</label>
                </div>
            </div>
            <div class="mt-2">
                <p><strong>Boisson :</strong></p>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="coca" value="Coca" v-model="boisson">
                    <label class="form-check-label" for="coca">Coca</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="eau" value="Verre d'eau" v-model="boisson">
                    <label class="form-check-label" for="eau">Verre d'eau</label>
                </div>
            </div>
        </div>

        <br/>
        <h3 class="text-center">Prix du burger : {{ prixBurger }} €</h3>
    </div>
</div>
<script>
    new Vue({
        el: "#app",
        data: {
            ingredients: [
                { id: 'pain', nom: 'Pain', image: 'img/pain.png', prix: 1, quantite: 0 },
                { id: 'salade', nom: 'Salade', image: 'img/salade.png', prix: 0.15, quantite: 0 },
                { id: 'tomates', nom: 'Tomates', image: 'img/tomates.jpg', prix: 0.5, quantite: 0 },
                { id: 'oignons', nom: 'Oignons', image: 'img/oignons.jpeg', prix: 0.3, quantite: 0 },
                { id: 'steak', nom: 'Steak', image: 'img/steak.jpg', prix: 2, quantite: 0 }
            ],
            menu: false,
            accompagnement: 'Frites',
            boisson: 'Coca'
        },
        computed: {
            prixBurger: function () {
                var total = 0;
                this.ingredients.forEach(function (ingredient) {
                    total += ingredient.prix * ingredient.quantite;
                });
                if (this.menu) {
                    total += 3;
                }
                return total.toFixed(2);
            }
        },
        methods: {
            ajouter: function (ingredient) {
                if (ingredient.quantite < 3) {
                    ingredient.quantite++;
                }
            },
            supprimer: function (ingredient) {
                if (ingredient.quantite > 0) {
                    ingredient.quantite--;
                }
            }
        }
    });
</script>
</body>
</html>
